# config.yaml

paths:
  train_csv: "src/sample_data/train_labels.csv"
  test_csv:  "src/sample_data/test_labels.csv"
  root_dir:  "src/sample_data/image_files/"
  checkpoint_dir: "{model_name}_logs"
  best_checkpoint: "{model_name}_logs/best_cer.pt"
  test_root: "src/sample_data/image_files/test"
  log_dir: "src/sample_data/logs"


train_data_type: "synthetic" # 'handwritten', 'synthetic', 'typed'
test_data_type: "hdd" # 'handwritten', 'synthetic', 'typed'

dataset:
  img_height:   100
  img_width:    1000
  batch_size:   64
  num_workers:  4
  dev_size:    0.2
  random_state: 42



model:
  model_name: "crnn_amharic"
  hidden_size: 256
  # num_classes will be computed as len(charset) + 1 in code

finetune:
  fine_tune: false
  fine_tune_model_name: 
  # freeze_layers: true
  # freeze_layers_count: 2
training:
  epochs:         30
  learning_rate:  0.00004
  device:         "cuda"      # or "cpu"
  save_samples:   true
  sample_count:   10


wandb:
  project:  "Amharic OCR CRNN"
  name:    "{model_name}_run"


  # API key should be set via WANDB_API_KEY env var, not in config

converter:
  # charset will be built from train/test CSVs at runtime
